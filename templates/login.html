<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - DIO Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        santander: '#EC0000',
                        santanderDark: '#CC0000',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="w-full max-w-md p-10 bg-white border border-gray-200 shadow-xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-santander tracking-tight">DIO Bank</h1>
            <p class="text-gray-500 mt-2 text-sm font-semibold uppercase tracking-widest">Corretora de Valores</p>
        </div>

        <div id="error-message" class="hidden mb-6 p-4 bg-red-50 border-l-4 border-santander text-santander text-sm font-medium"></div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">CPF ou Usuário</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 bg-white border border-gray-300 focus:ring-2 focus:ring-santander focus:border-santander outline-none transition-colors text-gray-900 placeholder-gray-400"
                    placeholder="Digite seu acesso">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-white border border-gray-300 focus:ring-2 focus:ring-santander focus:border-santander outline-none transition-colors text-gray-900 placeholder-gray-400"
                    placeholder="Sua senha de acesso">
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-3.5 px-4 bg-santander hover:bg-santanderDark text-white font-bold shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-santander">
                    Acessar minha conta
                </button>
            </div>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            Ainda não é cliente? 
            <a href="/register" class="text-santander font-bold hover:underline transition-colors">Abra sua conta</a>
        </p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const data = await res.json();
                    errorDiv.textContent = data.error || 'Erro ao fazer login';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão com o servidor';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
