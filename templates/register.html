<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de Conta - DIO Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        santander: '#EC0000',
                        santanderDark: '#CC0000',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center font-sans antialiased py-12">
    <div class="w-full max-w-md p-10 bg-white border border-gray-200 shadow-xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-santander tracking-tight">DIO Bank</h1>
            <p class="text-gray-500 mt-2 text-sm font-semibold uppercase tracking-widest">Abertura de Conta</p>
        </div>

        <div id="message-box" class="hidden mb-6 p-4 border-l-4 text-sm font-medium"></div>

        <form id="register-form" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Escolha seu Usuário (mín. 3 caracteres)</label>
                <input type="text" id="username" name="username" required minlength="3"
                    class="w-full px-4 py-3 bg-white border border-gray-300 focus:ring-2 focus:ring-santander focus:border-santander outline-none transition-colors text-gray-900 placeholder-gray-400"
                    placeholder="Ex: joaosilva">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Crie sua Senha (mín. 6 caracteres)</label>
                <input type="password" id="password" name="password" required minlength="6"
                    class="w-full px-4 py-3 bg-white border border-gray-300 focus:ring-2 focus:ring-santander focus:border-santander outline-none transition-colors text-gray-900 placeholder-gray-400"
                    placeholder="Sua senha segura">
            </div>

            <div>
                <label for="password_confirm" class="block text-sm font-medium text-gray-700 mb-2">Confirme a Senha</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="6"
                    class="w-full px-4 py-3 bg-white border border-gray-300 focus:ring-2 focus:ring-santander focus:border-santander outline-none transition-colors text-gray-900 placeholder-gray-400"
                    placeholder="Repita a senha">
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="w-full py-3.5 px-4 bg-santander hover:bg-santanderDark text-white font-bold shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-santander">
                    Finalizar Cadastro
                </button>
            </div>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            Já possui uma conta DIO Bank? 
            <a href="/login" class="text-santander font-bold hover:underline transition-colors">Faça login</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            const msgBox = document.getElementById('message-box');

            if (password !== password_confirm) {
                showMessage('As senhas não coincidem.', false);
                return;
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, password_confirm })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('Conta criada com sucesso! Redirecionando para o login...', true);
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showMessage(data.error || 'Erro ao registrar. Tente novamente.', false);
                }
            } catch (err) {
                showMessage('Erro de conexão com o servidor DIO Bank.', false);
            }
        });

        function showMessage(msg, isSuccess) {
            const box = document.getElementById('message-box');
            box.textContent = msg;
            box.classList.remove('hidden', 'bg-red-50', 'border-santander', 'text-santander', 'bg-green-50', 'border-green-600', 'text-green-700');
            
            if (isSuccess) {
                box.classList.add('bg-green-50', 'border-green-600', 'text-green-700');
            } else {
                box.classList.add('bg-red-50', 'border-santander', 'text-santander');
            }
        }
    </script>
</body>
</html>
